name: Update Basketball Data
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: pip install requests beautifulsoup4
      - name: Fetch league standings (api-sports.io)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: node scripts/update-basketball.js
      - name: Overlay broadcast channel from Telegram @sidorim
        run: python scripts/fetch_sidorim.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/bnei-herzliya.json data/sidorim-herzliya.json data/bhbasket-games.json
          git commit -m "Auto update basketball data" || exit 0
          git pull --rebase
          git push
