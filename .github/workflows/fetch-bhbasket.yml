name: fetch-bhbasket

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-bhbasket
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch games from club site
        run: python scripts/fetch_bhbasket.py
      - name: Fetch broadcast channel from Telegram @sidorim
        run: python scripts/fetch_sidorim.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bhbasket-games.json data/sidorim-herzliya.json data/bnei-herzliya.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Update Bnei Herzliya games and broadcast channel"
          git pull --rebase
          git push
