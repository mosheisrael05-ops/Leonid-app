 <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>עוזר יומי לליאוניד</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&family=Rubik:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Assistant', 'Rubik', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container { max-width: 900px; margin: 0 auto; width: 100%; }
        
        .main-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            border: none; border-radius: 30px; padding: 50px; margin: 30px 0;
            cursor: pointer; box-shadow: 0 20px 60px rgba(255,107,107,0.4);
            transition: all 0.3s ease; width: 100%; position: relative; overflow: hidden;
        }
        .main-button:active { transform: scale(0.95); box-shadow: 0 10px 30px rgba(255,107,107,0.3); }
        .button-text { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .button-icon { font-size: 80px; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .button-label-ru { font-size: 48px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .button-label-he { font-size: 42px; font-weight: 800; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .info-card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 25px; padding: 35px; margin: 25px 0;
            border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .date-section { text-align: center; margin-bottom: 40px; }
        .date-ru { font-size: 44px; font-weight: 700; margin-bottom: 15px; color: #4ecdc4; text-shadow: 0 0 20px rgba(78,205,196,0.5); }
        .date-he { font-size: 40px; font-weight: 700; color: #95e1d3; }
        .section-title { font-size: 36px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; color: #ffd93d; text-shadow: 0 0 15px rgba(255,217,61,0.5); }
        .section-icon { font-size: 48px; }
        .treatment-item { background: rgba(255,255,255,0.05); padding: 25px; margin: 15px 0; border-radius: 20px; border-right: 6px solid #4ecdc4; }
        .treatment-time { font-size: 42px; font-weight: 900; color: #ff6b6b; margin-bottom: 10px; }
        .treatment-name { font-size: 36px; font-weight: 700; margin-bottom: 8px; }
        .treatment-location { font-size: 30px; color: #95e1d3; font-weight: 500; }
        .no-treatments { font-size: 38px; text-align: center; padding: 40px; color: #95e1d3; font-weight: 600; }
        .work-info { font-size: 40px; font-weight: 700; padding: 30px; background: linear-gradient(135deg, rgba(255,107,107,0.2), rgba(238,90,111,0.2)); border-radius: 20px; text-align: center; margin: 20px 0; }
        .work-name { font-size: 52px; font-weight: 900; color: #ffd93d; text-shadow: 0 0 20px rgba(255,217,61,0.5); }
        .basketball-section { margin-top: 30px; }
        .basketball-stats { display: grid; gap: 20px; margin-top: 25px; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; border-right: 6px solid #ffd93d; }
        .stat-label { font-size: 32px; color: #95e1d3; margin-bottom: 12px; font-weight: 600; }
        .stat-value { font-size: 38px; font-weight: 800; color: #ffffff; }
        .status-indicator {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #4ecdc4 0%, #44a8a0 100%);
            color: white; padding: 25px 50px; border-radius: 50px; font-size: 36px;
            font-weight: 700; box-shadow: 0 10px 40px rgba(78,205,196,0.4);
            z-index: 1000; transition: transform 0.3s ease;
        }
        .status-indicator.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="status-indicator" id="statusIndicator">מדבר...</div>
    <div class="container">
        <button class="main-button" id="speakButton">
            <div class="button-text">
                <div class="button-icon">🔊</div>
                <div class="button-label-ru">ГОВОРИТЬ</div>
                <div class="button-label-he">לדבר</div>
            </div>
        </button>
        <div class="info-card">
            <div class="date-section">
                <div class="date-ru" id="dateRu">טוען...</div>
                <div class="date-he" id="dateHe">Загрузка...</div>
            </div>
            <div class="section-title"><span class="section-icon">💊</span><span>הטיפולים שלך היום / Твои процедуры сегодня</span></div>
            <div id="treatmentsContainer"><div class="no-treatments">טוען... / Загрузка...</div></div>
        </div>
        <div class="info-card">
            <div class="section-title"><span class="section-icon">👷</span><span>מי עובד מחר / Кто работает завтра</span></div>
            <div class="work-info" id="tomorrowWorker">טוען... / Загрузка...</div>
        </div>
        <div class="info-card basketball-section">
            <div class="section-title"><span class="section-icon">🏀</span><span>בני הרצליה / Бней Герцлия</span></div>
            <div class="basketball-stats">
                <div class="stat-item"><div class="stat-label">מיקום בטבלה / Место в таблице:</div><div class="stat-value" id="tablePosition">טוען...</div></div>
                <div class="stat-item"><div class="stat-label">משחק אחרון / Последняя игра:</div><div class="stat-value" id="lastResult">טוען...</div></div>
                <div class="stat-item"><div class="stat-label">משחק הבא / Следующая игра:</div><div class="stat-value" id="nextGame">טוען...</div></div>
            </div>
        </div>
    </div>

    <script>
        const weeklyTreatments = {
            0: [{ time: '12:30', name: 'לינור', nameRu: 'Линор', location: 'בית לווינשטיין רעננה', locationRu: 'Бейт Левинштейн Раанана' }],
            1: [
                { time: '10:45', name: 'פיזיותרפיה - אוטה דיטריך', nameRu: 'Физиотерапия - Ота Дитрих', location: 'תל אביב', locationRu: 'Тель-Авив' },
                { time: '11:45', name: 'התעמלות אישית', nameRu: 'Персональная тренировка', location: 'בית הלוחם תל אביב', locationRu: 'Бейт ха-Лохем Тель-Авив' }
            ],
            2: [{ time: '11:00', name: 'פיזיותרפיה - אוטה דיטריך', nameRu: 'Физиотерапия - Ота Дитрих', location: 'תל אביב', locationRu: 'Тель-Авив' }],
            3: [
                { time: '10:45', name: 'פיזיותרפיה - אוטה דיטריך', nameRu: 'Физиотерапия - Ота Дитрих', location: 'תל אביב', locationRu: 'Тель-Авив' },
                { time: '11:00', name: 'אימון אישי - שמעון', nameRu: 'Персональная тренировка - Шимон', location: 'בית הלוחם תל אביב', locationRu: 'Бейт ха-Лохем Тель-Авив' }
            ],
            4: [{ time: '11:30', name: 'התעמלות אישית - ליאוניד', nameRu: 'Персональная тренировка - Леонид', location: 'בית הלוחם תל אביב', locationRu: 'Бейт ха-Лохем Тель-Авив' }],
            5: [
                { time: '11:00', name: 'פיזיותרפיה - אוטה דיטריך', nameRu: 'Физиотерапия - Ота Дитрих', location: 'תל אביב', locationRu: 'Тель-Авив' },
                { time: '12:30', name: 'אולג פגוסט', nameRu: 'Олег Пагост', location: 'בית הלוחם תל אביב קומה מינוס אחת', locationRu: 'Бейт ха-Лохем Тель-Авив, минус первый этаж' }
            ],
            6: []
        };

        const workSchedule = {
            // פברואר 2026
            '2026-02-01': 'מטי', '2026-02-02': 'נתנאל', '2026-02-03': 'גומן', '2026-02-04': 'משה',
            '2026-02-05': 'סטס', '2026-02-06': 'גומן', '2026-02-07': 'משה', '2026-02-08': 'מטי',
            '2026-02-09': 'גומן', '2026-02-10': 'משה', '2026-02-11': 'נתנאל', '2026-02-12': 'סטס',
            '2026-02-13': 'משה', '2026-02-14': 'נתנאל', '2026-02-15': 'מטי', '2026-02-16': 'סטס',
            '2026-02-17': 'משה', '2026-02-18': 'גומן', '2026-02-19': 'נתנאל', '2026-02-20': 'משה',
            '2026-02-21': 'גומן', '2026-02-22': 'מטי', '2026-02-23': 'נתנאל', '2026-02-24': 'משה',
            '2026-02-25': 'גומן', '2026-02-26': 'סטס', '2026-02-27': 'נתנאל', '2026-02-28': 'גומן',
            // מרץ 2026
            '2026-03-01': 'מטי', '2026-03-02': 'משה', '2026-03-03': 'גומן', '2026-03-04': 'סטס',
            '2026-03-05': 'נתנאל', '2026-03-06': 'משה', '2026-03-07': 'גומן', '2026-03-08': 'מטי',
            '2026-03-09': 'גומן', '2026-03-10': 'משה', '2026-03-11': 'נתנאל', '2026-03-12': 'סטס',
            '2026-03-13': 'גומן', '2026-03-14': 'משה', '2026-03-15': 'מטי', '2026-03-16': 'נתנאל',
            '2026-03-17': 'משה', '2026-03-18': 'גומן', '2026-03-19': 'סטס', '2026-03-20': 'משה',
            '2026-03-21': 'גומן', '2026-03-22': 'מטי', '2026-03-23': 'משה', '2026-03-24': 'גומן',
            '2026-03-25': 'מטי', '2026-03-26': 'סטס', '2026-03-27': 'גומן', '2026-03-28': 'נתנאל',
            '2026-03-29': 'מטי', '2026-03-30': 'משה', '2026-03-31': 'נתנאל',
            // אפריל 2026
            '2026-04-01': 'סטס', '2026-04-02': 'גומן', '2026-04-03': 'נתנאל', '2026-04-04': 'גומן',
            '2026-04-05': 'מטי', '2026-04-06': 'נתנאל', '2026-04-07': 'משה', '2026-04-08': 'גומן',
            '2026-04-09': 'סטס', '2026-04-10': 'משה', '2026-04-11': 'נתנאל', '2026-04-12': 'מטי',
            '2026-04-13': 'גומן', '2026-04-14': 'משה', '2026-04-15': 'נתנאל', '2026-04-16': 'סטס',
            '2026-04-17': 'משה', '2026-04-18': 'גומן', '2026-04-19': 'מטי', '2026-04-20': 'נתנאל',
            '2026-04-21': 'סטס', '2026-04-22': 'גומן', '2026-04-23': 'סטס', '2026-04-24': 'משה',
            '2026-04-25': 'נתנאל', '2026-04-26': 'מטי', '2026-04-27': 'משה', '2026-04-28': 'גומן',
            '2026-04-29': 'נתנאל', '2026-04-30': 'משה'
        };

        const workerNamesRu = { 'מטי': 'Мати', 'נתנאל': 'Натаниэль', 'גומן': 'Гуман', 'משה': 'Моше', 'סטס': 'Стас' };
        const workerPronounce = { 'נתנאל': 'נתנאייל', 'מטי': 'מאטי' };
        function getWorkerRu(name) { return workerNamesRu[name] || name; }
        function getWorkerSpeak(name) { return workerPronounce[name] || name; }

        const hebrewDays = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
        const russianDays = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
        const hebrewMonths = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
        const russianMonths = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

        let basketballData = {
            position: 'פלייאוף בית עליון (טופ 8)',
            positionRu: 'Плей-офф — верхняя группа (топ 8)',
            lastGame: 'הפסד 81:102 להפועל ירושלים (בית עליון — 18.04.26)',
            lastGameRu: 'Поражение 81:102 от Апоэль Иерусалим (верхняя группа — 18.04.26)',
            nextGame: 'נגד עירוני נס ציונה | בית עליון | 26.04.26 | 19:30',
            nextGameRu: 'против Ирони Нес-Циона | верхняя группа | 26.04.26 | 19:30'
        };

        async function loadBasketballData() {
            try {
                // שלב 1: מציאת מזהה הקבוצה
                const teamRes = await fetch('https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=Bnei+Herzliya');
                const teamData = await teamRes.json();
                const team = teamData.teams?.[0];
                if (!team) throw new Error('Team not found');
                const teamId = team.idTeam;

                // שלב 2: משחק אחרון
                const lastRes = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=${teamId}`);
                const lastData = await lastRes.json();
                const lastEvent = lastData.results?.[lastData.results.length - 1];

                if (lastEvent) {
                    const herzHome = lastEvent.strHomeTeam.toLowerCase().includes('herzliya');
                    const herzScore = herzHome ? lastEvent.intHomeScore : lastEvent.intAwayScore;
                    const oppScore  = herzHome ? lastEvent.intAwayScore : lastEvent.intHomeScore;
                    const opponent  = herzHome ? lastEvent.strAwayTeam : lastEvent.strHomeTeam;
                    const won = parseInt(herzScore) > parseInt(oppScore);
                    const resultHe = won ? 'ניצחון' : 'הפסד';
                    const resultRu = won ? 'Победа' : 'Поражение';
                    const dateStr  = lastEvent.dateEvent || '';
                    const dateFmt  = dateStr ? dateStr.split('-').reverse().join('.') : '';
                    basketballData.lastGame   = `${resultHe} ${herzScore}:${oppScore} נגד ${opponent}${dateFmt ? ' (' + dateFmt + ')' : ''}`;
                    basketballData.lastGameRu = `${resultRu} ${herzScore}:${oppScore} против ${opponent}${dateFmt ? ' (' + dateFmt + ')' : ''}`;
                }

                // שלב 3: משחק הבא
                const nextRes = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventsnext.php?id=${teamId}`);
                const nextData = await nextRes.json();
                const nextEvent = nextData.events?.[0];

                if (nextEvent) {
                    const herzHome  = nextEvent.strHomeTeam.toLowerCase().includes('herzliya');
                    const opponent  = herzHome ? nextEvent.strAwayTeam : nextEvent.strHomeTeam;
                    const dateStr   = nextEvent.dateEvent || '';
                    const dateFmt   = dateStr ? dateStr.split('-').reverse().join('.') : '';
                    const timeStr   = nextEvent.strTime ? nextEvent.strTime.slice(0,5) : '';
                    const homeAway  = herzHome ? 'בבית' : 'בחוץ';
                    basketballData.nextGame   = `נגד ${opponent} | ${dateFmt}${timeStr ? ' | ' + timeStr : ''} | ${homeAway}`;
                    basketballData.nextGameRu = `против ${opponent} | ${dateFmt}${timeStr ? ' | ' + timeStr : ''}`;
                }

                console.log('נתוני כדורסל נטענו בהצלחה מ-TheSportsDB ✅');

            } catch (e) {
                console.log('TheSportsDB לא זמין — משתמש בנתונים קבועים:', e.message);
            }

            document.getElementById('tablePosition').textContent = basketballData.position;
            document.getElementById('lastResult').textContent    = basketballData.lastGame;
            document.getElementById('nextGame').textContent      = basketballData.nextGame;
        }

        function formatDate(date) {
            const dayOfWeek = date.getDay();
            const day = date.getDate();
            const month = date.getMonth();
            const year = date.getFullYear();
            return {
                ru: `Сегодня ${russianDays[dayOfWeek]}, ${day} ${russianMonths[month]} ${year}`,
                he: `היום יום ${hebrewDays[dayOfWeek]}, ${day} ב${hebrewMonths[month]} ${year}`,
                dayOfWeek: dayOfWeek
            };
        }

        function getDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getTomorrowWorker(today) {
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            return workSchedule[getDateKey(tomorrow)] || 'אין מידע';
        }

        function updateDisplay() {
            const today = new Date();
            const dateInfo = formatDate(today);
            document.getElementById('dateRu').textContent = dateInfo.ru;
            document.getElementById('dateHe').textContent = dateInfo.he;

            const todayTreatments = weeklyTreatments[dateInfo.dayOfWeek];
            const treatmentsContainer = document.getElementById('treatmentsContainer');
            if (todayTreatments && todayTreatments.length > 0) {
                treatmentsContainer.innerHTML = todayTreatments.map(t => `
                    <div class="treatment-item">
                        <div class="treatment-time">${t.time}</div>
                        <div class="treatment-name">${t.name}</div>
                        <div class="treatment-location">${t.location}</div>
                    </div>`).join('');
            } else {
                treatmentsContainer.innerHTML = '<div class="no-treatments">מנוחה היום 😊<br>Отдых сегодня</div>';
            }

            const tomorrowWorker = getTomorrowWorker(today);
            document.getElementById('tomorrowWorker').innerHTML = `
                <div style="color:#95e1d3;font-size:36px;margin-bottom:10px;">Завтра работает:</div>
                <div class="work-name">${getWorkerRu(tomorrowWorker)}</div>
                <div style="color:#95e1d3;font-size:36px;margin-top:15px;">מחר עובד: ${tomorrowWorker}</div>`;
        }

        function speakText(text, lang) {
            return new Promise((resolve) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang; utterance.rate = 0.85; utterance.pitch = 1.0; utterance.volume = 1.0;
                utterance.onend = resolve; utterance.onerror = resolve;
                speechSynthesis.speak(utterance);
            });
        }

        let isSpeaking = false;

        async function speakAll() {
            if (isSpeaking) return;
            isSpeaking = true;
            speechSynthesis.cancel();
            const today = new Date();
            const dateInfo = formatDate(today);
            const todayTreatments = weeklyTreatments[dateInfo.dayOfWeek];
            const tomorrowWorker = getTomorrowWorker(today);
            showStatus('מדבר... / Говорю...');
            await speakText(dateInfo.ru, 'ru-RU');
            if (todayTreatments && todayTreatments.length > 0) {
                await speakText('Твои процедуры сегодня:', 'ru-RU');
                for (const t of todayTreatments) await speakText(`${t.nameRu}, ${t.locationRu}, в ${t.time}`, 'ru-RU');
            } else {
                await speakText('Сегодня отдых, процедур нет', 'ru-RU');
            }
            await speakText(`Завтра работает ${getWorkerRu(tomorrowWorker)}`, 'ru-RU');
            await speakText(`Бней Герцлия: ${basketballData.positionRu}`, 'ru-RU');
            await speakText(basketballData.lastGameRu, 'ru-RU');
            await speakText(`Следующая игра: ${basketballData.nextGameRu}`, 'ru-RU');
            await speakText(dateInfo.he, 'he-IL');
            if (todayTreatments && todayTreatments.length > 0) {
                await speakText('הטיפולים שלך היום:', 'he-IL');
                for (const t of todayTreatments) await speakText(`${t.name}, ${t.location}, בשעה ${t.time}`, 'he-IL');
            } else {
                await speakText('היום מנוחה, אין טיפולים', 'he-IL');
            }
            await speakText(`מחר עובד ${getWorkerSpeak(tomorrowWorker)}`, 'he-IL');
            await speakText(`בני הרצליה: ${basketballData.position}`, 'he-IL');
            await speakText(basketballData.lastGame, 'he-IL');
            await speakText(`משחק הבא: ${basketballData.nextGame}`, 'he-IL');
            showStatus('סיימתי! / Готово!');
            setTimeout(() => hideStatus(), 2000);
            isSpeaking = false;
        }

        function showStatus(message) {
            const indicator = document.getElementById('statusIndicator');
            indicator.textContent = message;
            indicator.classList.add('show');
        }
        function hideStatus() { document.getElementById('statusIndicator').classList.remove('show'); }

        loadBasketballData();
        updateDisplay();
        window.addEventListener('load', () => setTimeout(() => speakAll(), 1000));
        document.getElementById('speakButton').addEventListener('click', () => {
            isSpeaking = false; speechSynthesis.cancel(); speakAll();
        });
        setInterval(updateDisplay, 60000);
    </script>
</body>
</html>
